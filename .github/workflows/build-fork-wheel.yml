name: Publish Fork Wheel

# On every push to the fork's `shared-context` branch, build the wheel and
# publish it as a GitHub prerelease so a downstream app can pin it by
# URL (`releases/download/<tag>/…whl`).
#
# The wheel embeds a UMD bundle built against the fork's vtk-js `shared-context`
# branch (PaulHax/vtk-js), so CI and the app agree on exactly which vtk-js the
# wheel carries. Because CI clones that same tested branch, the UMD it builds
# matches what was validated locally — the old "CI rebuild is byte-divergent and
# untested, so never publish from CI" caveat no longer applies.
#
# This reuses `./release.sh --publish` — the same script devs run locally — so
# version stamping, the UMD byte-assert, the tag scheme
# (`v<base>-shared-context.<sha>`), and release creation live in ONE place.

on:
  push:
    branches: [shared-context]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: trame-vtklocal

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Build the vtk-js fork (shared-context) and expose it via npm link
        run: |
          git clone --depth 1 --branch shared-context https://github.com/PaulHax/vtk-js.git
          cd vtk-js && npm ci && npm run build:esm
          cd dist/esm && npm link

      - name: Install vue-components deps and link the fork vtk-js
        working-directory: trame-vtklocal/vue-components
        # `npm ci` wipes node_modules but keeps the global link, so link after it.
        # release.sh runs the actual `npm run build` against this link.
        run: npm ci && npm link @kitware/vtk.js

      - name: Build + publish the fork wheel release
        working-directory: trame-vtklocal
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          pip install build vtk
          ./release.sh --publish | tee /tmp/release.out
          {
            echo '### Fork wheel published :package:'
            echo
            echo 'Pin in the app `pyproject.toml`:'
            echo '```toml'
            grep -m1 'trame-vtklocal = {' /tmp/release.out || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
