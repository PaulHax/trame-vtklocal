name: Build Fork Wheel

# Build-only sanity check. This workflow does NOT publish a release.
#
# Releases are cut locally with `./release.sh --publish`, which ships the
# locally-built, tested UMD bundle (and asserts the wheel's embedded UMD
# byte-matches that build). CI does not publish because it independently
# rebuilds the vtk-js fork, yielding a byte-divergent, untested UMD; publishing
# that would ship an artifact no one has run. The uploaded artifact below is a
# build check only — proof the wheel still builds — never a release.

on:
  push:
    branches: [shared-context]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: trame-vtklocal

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Clone and build vtk-js fork
        run: |
          git clone --depth 1 --branch shared-context https://github.com/PaulHax/vtk-js.git
          cd vtk-js && npm ci && npm run build:esm
          cd dist/esm && npm link

      - name: Build vue-components
        working-directory: trame-vtklocal/vue-components
        run: npm ci && npm link @kitware/vtk.js && npm run build

      - name: Build wheel
        working-directory: trame-vtklocal
        run: |
          # Stamp the same <base>+shared-context.<sha> version the local
          # release.sh produces (read by hatch_build.py at build time).
          export TRAME_VTKLOCAL_SHA=$(git rev-parse --short HEAD)
          pip install build && python -m build --wheel

      - uses: actions/upload-artifact@v4
        with:
          name: trame-vtklocal-fork-wheel
          path: trame-vtklocal/dist/*.whl
