repos:
  - repo: https://github.com/codespell-project/codespell
    rev: v2.1.0
    hooks:
      - id: codespell

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
      - id: ruff-format

  # Checks against the project environment so VTK, numpy and aiohttp resolve
  # to their shipped type information.
  - repo: local
    hooks:
      - id: mypy
        name: mypy --strict
        entry: .venv/bin/python -m mypy
        language: system
        pass_filenames: false
        files: ^(src/|pyproject\.toml)
