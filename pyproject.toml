[project]
name = "trame-vtklocal"
# Version is stamped at build time (base + git short sha) by the custom
# metadata hook in hatch_build.py. Base version lives there as BASE_VERSION.
dynamic = ["version"]
description = "VTK Local Rendering using WASM"
authors = [
    {name = "Kitware Inc."},
]
dependencies = [
    "trame",
    "trame-common",
]
requires-python = ">=3.9"
readme = "README.rst"
license = {text = "Apache Software License"}
keywords = ["Python", "Interactive", "Web", "Application", "Framework"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "License :: OSI Approved :: Apache Software License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
vtk = [
    # 9.6 is the first VTK that ships a serializer for vtkPointGaussianMapper.
    # Older wheels resolve the mapper to vtkOpenGLPointGaussianMapper and then
    # fail to add its state, so every point-cloud anchor silently drops off the
    # wire instead of raising.
    "vtk>=9.6",
]
dev = [
    "pre-commit",
    "ruff",
    "pytest",
    "pytest-asyncio",
    "trame-client[test]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Stamps <base>+shared-context.<short-sha> into the wheel version at build time.
[tool.hatch.metadata.hooks.custom]

[tool.hatch.build]
include = [
  "/src/trame_vtklocal/**/*.py",
  # Ship only the vtk.js WebGL shared-context assets (UMD bundle + css).
  "/src/trame_vtklocal/module/serve/js/**",
  "/src/trame/**/*.py",
]
# The wheel target's `packages` (below) recursively grabs the whole
# src/trame_vtklocal tree, which would otherwise sweep in serve/wasm/ whenever
# that runtime/dev artifact is populated locally. serve/wasm/ belongs solely to
# the WASM LocalView path, which this fork's consumers never mount, so exclude
# it explicitly to keep the wheel WASM-free (~800 KB) regardless of the working
# tree's serve/wasm/ contents.
exclude = [
  "/src/trame_vtklocal/module/serve/wasm/**",
]

[tool.hatch.build.targets.wheel]
packages = [
    "src/trame_vtklocal",
    "src/trame",
]

[tool.semantic_release]
version_toml = [
    "pyproject.toml:project.version",
]
build_command = """
  python -m venv .venv
  source .venv/bin/activate
  pip install -U pip build
  python -m build .
"""

[semantic_release.publish]
dist_glob_patterns = ["dist/*"]
upload_to_vcs_release = true

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py39"

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
# ``tests/push_oracle_e2e`` modules import ``from tests.push_oracle...`` which
# requires the repo root on sys.path. ``pythonpath = ["."]`` makes that
# explicit instead of depending on pytest's incidental rootdir discovery.
pythonpath = ["."]
markers = [
    "js_oracle: end-to-end Playwright push-sync oracle (~30s; needs Playwright + Chromium). Skip with -m 'not js_oracle' if Playwright isn't installed.",
]

[tool.ruff.lint]
select = ["E", "W", "F"]
ignore = []
fixable = ["ALL"]
unfixable = []


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = "dynamic"

[tool.ruff.lint.pycodestyle]
max-line-length = 120

[lint.pydocstyle]
convention = "google"
